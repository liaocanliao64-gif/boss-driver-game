<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101620"><meta name="description" content="老板，你的司机要收购公司了。海湾都市商战与互动经营，点击开始你的故事。">
<meta property="og:title" content="老板，你的司机要收购公司了"><meta property="og:description" content="从司机到掌舵者，在海湾开启你的商业版图。">
<title>老板，你的司机要收购公司了</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c121b;color:#eeede8;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#gate{position:fixed;inset:0;display:flex;align-items:center;padding:max(28px,env(safe-area-inset-top)) max(7vw,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(8,14,23,.97),rgba(8,14,23,.8) 32%,rgba(8,14,23,.1)),url(cover.png) right center/cover;z-index:2}.card{width:min(460px,90vw)}.logo{display:block;width:100%;height:auto;margin-bottom:16px}.english{font-family:Georgia,serif;font-size:clamp(14px,1.7vw,20px);color:#ced3dc;letter-spacing:.02em;margin-bottom:40px}button{font:inherit;border:0;background:#eeeae2;color:#17212b;min-height:52px;padding:14px 26px;min-width:190px;cursor:pointer;text-align:left;border-radius:2px}button:disabled{opacity:.65;cursor:progress}button:focus-visible{outline:2px solid #e7d4ad;outline-offset:5px}#start::after{content:' →';float:right;margin-left:35px}#note,#status{color:#bac2cd;font-size:13px;line-height:1.8;margin:14px 0 0}#status{color:#e0d5bb;min-height:24px}progress{display:none;width:100%;height:4px;margin-top:22px;accent-color:#c9b794}#rotate{display:none;position:fixed;z-index:3;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#eee;font-size:12px;padding:7px 12px;background:#0c121bd9;border-radius:3px;pointer-events:none}body.playing #gate{display:none}@media(orientation:portrait){#gate{align-items:flex-end;background:linear-gradient(0deg,#0a111bf7,#0a111bd9 46%,#0a111b24),url(cover.png) 68% center/cover;padding:36px 26px max(42px,env(safe-area-inset-bottom))}.card{width:100%}.english{margin-bottom:26px}body.playing #rotate{display:block}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .4s ease-out}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="游戏画面"></canvas>
<section id="gate"><div class="card"><img class="logo" src="title.svg" alt="老板，你的司机要收购公司了"><div class="english">Boss, Your Driver Is Taking Over</div><button id="start">开始游戏</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status" aria-live="polite"></p><p id="note">首次需加载约 393MB，建议连接 Wi-Fi。<br>横屏游玩体验更好，进度保存在当前浏览器中。</p></div></section>
<div id="rotate">建议将手机横过来游玩</div>
<script>
'use strict';
// Track actual audio contexts so the second human tap can unlock iOS/WeChat audio.
const audioContexts=[];
for(const key of ['AudioContext','webkitAudioContext']){const Base=window[key];if(Base)window[key]=new Proxy(Base,{construct(target,args){const ctx=Reflect.construct(target,args);audioContexts.push(ctx);return ctx;}});}
const nativeFetch=window.fetch.bind(window);let files,engine,phase='initial';const got={};
const button=document.querySelector('#start'),status=document.querySelector('#status'),progress=document.querySelector('#progress');
function update(){if(!files)return;const total=Object.values(files).reduce((a,v)=>a+v.bytes,0),current=Object.values(got).reduce((a,v)=>a+v,0);progress.value=current/total;status.textContent=`正在加载 ${(current/1e6).toFixed(1)} / ${(total/1e6).toFixed(1)} MB`;}
// Streaming joins preserve the original Godot bytes without one oversized hosted file.
window.fetch=async function(input,options){const raw=typeof input==='string'?input:input.url,url=new URL(raw,location.href),name=url.pathname.split('/').pop();if(!files||url.origin!==location.origin||!files[name])return nativeFetch(input,options);const spec=files[name];let part=0,reader=null;got[name]=0;const body=new ReadableStream({async pull(controller){try{while(true){if(!reader){if(part>=spec.parts.length){controller.close();return;}const response=await nativeFetch(spec.parts[part++].file,options);if(!response.ok)throw new Error('资源下载中断，请重新打开后重试。');reader=response.body.getReader();}const item=await reader.read();if(item.done){reader=null;continue;}got[name]+=item.value.byteLength;update();controller.enqueue(item.value);return;}}catch(error){controller.error(error);}},async cancel(reason){if(reader)await reader.cancel(reason);}});return new Response(body,{headers:{'Content-Type':name.endsWith('.wasm')?'application/wasm':'application/octet-stream','Content-Length':String(spec.bytes)}});};
function showError(error){console.error(error);phase='error';button.disabled=false;button.textContent='重新加载';document.body.classList.remove('playing');status.textContent='暂时未能进入游戏。请检查网络；若微信内仍无法运行，可从右上角选择在浏览器打开。';}
function script(url){return new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=url;el.onload=resolve;el.onerror=reject;document.head.append(el);});}
button.addEventListener('click',async()=>{if(phase==='error'){location.reload();return;}if(phase==='ready'){button.disabled=true;try{for(const ctx of audioContexts)if(ctx.state==='suspended')ctx.resume();const fullscreen=document.documentElement.requestFullscreen;if(fullscreen&&!/MicroMessenger/i.test(navigator.userAgent))fullscreen.call(document.documentElement).catch(()=>{});await engine.start({args:['--main-pack','game.pck']});for(const ctx of audioContexts)if(ctx.state==='suspended')ctx.resume();document.body.classList.add('playing');document.querySelector('#canvas').focus();phase='playing';window.gameStarted=true;}catch(error){showError(error);}return;}if(phase!=='initial')return;phase='loading';button.disabled=true;button.textContent='正在加载';progress.style.display='block';try{files=await(await nativeFetch('game-files.json')).json();if(!window.WebAssembly||!window.ReadableStream)throw new Error('browser capabilities');await script('game.js');const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error(missing.join(', '));engine=new Engine({executable:'game',canvas:document.querySelector('#canvas'),canvasResizePolicy:2,focusCanvas:true,ensureCrossOriginIsolationHeaders:false,fileSizes:Object.fromEntries(Object.entries(files).map(([k,v])=>[k,v.bytes])),onPrint:console.log,onPrintError:console.error,onExit:()=>{document.body.classList.remove('playing');phase='error';button.textContent='重新进入';button.disabled=false;status.textContent='游戏已退出，点击重新进入。';}});window.gameEngine=engine;await Promise.all([engine.init('game'),engine.preloadFile('game.pck','game.pck')]);phase='ready';button.disabled=false;button.textContent='进入游戏';progress.value=1;status.textContent='加载完成，点击进入并开启声音。';window.gameReady=true;}catch(error){showError(error);}});
</script>
</body></html>
